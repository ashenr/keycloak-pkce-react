services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: <your-admin-password>

      # 1. Hostname Settings
      # Must match the domain you set up in Nginx/Certbot
      KC_HOSTNAME: your-keycloak-domain.com

      # 2. Enable HTTP (because Nginx talks to Keycloak via HTTP on localhost)
      KC_HTTP_ENABLED: "true"

      # 3. Proxy Configuration
      # Tells Keycloak to look at the headers Nginx sends (X-Forwarded-Proto)
      # to understand it is actually running on HTTPS.
      KC_PROXY_HEADERS: "xforwarded"

      # Optional: Relax strictness if you run into specific dev issues,
      # but with the settings above, strict is usually fine.
      KC_HOSTNAME_STRICT: "false"

    command:
      - start-dev
      - --http-enabled=true # Ensures HTTP listener is on for Nginx
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data: